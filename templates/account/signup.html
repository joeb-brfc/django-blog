{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6">

      <h1 class="mb-3">{% trans "Sign Up" %}</h1>

      <p class="text-muted">
        {% blocktrans %}Already have an account? Then please
        <a href="{{ login_url }}">sign in</a>.{% endblocktrans %}
      </p>

      <form method="post" action="{{ signup_url }}">
        {% csrf_token %}
        {{ form.as_p }}
        {% if redirect_field_value %}
          <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
        {% endif %}

        <button class="btn btn-success" type="submit">{% trans "Sign Up" %}</button>
      </form>

    </div>
  </div>
</div>
{% endblock %}
